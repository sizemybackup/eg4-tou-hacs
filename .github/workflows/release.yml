name: Release

# Push a tag like v0.7.3 and this publishes the GitHub Release that HACS lists.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match manifest version
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(jq -r .version custom_components/eg4_tou/manifest.json)"
          [ "$want" = "$have" ] || { echo "tag $GITHUB_REF_NAME but manifest says $have"; exit 1; }
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && { echo "release exists"; exit 0; }
          # checkout stores the tag as lightweight; fetch the annotated tag to get its message
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          notes="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "${notes:-Release $GITHUB_REF_NAME}" --verify-tag
