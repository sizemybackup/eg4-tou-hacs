name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly, to catch new HACS/hassfest rules
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Python tests (coverage must stay above 95%, see quality_scale.yaml)
        run: >
          uv run --python 3.14 --no-project
          --with pytest-homeassistant-custom-component --with holidays --with home-assistant-frontend
          --with pytest-cov
          python -I -m pytest -q --cov=custom_components/eg4_tou --cov-report=term-missing --cov-fail-under=95
      - name: Strict typing (mypy --strict)
        run: >
          uv run --python 3.14 --no-project
          --with homeassistant --with holidays --with mypy --with types-python-dateutil
          python -I -m mypy --strict --follow-imports=silent custom_components/eg4_tou
      - name: Card tests
        run: node --test tests/frontend/*.test.mjs
