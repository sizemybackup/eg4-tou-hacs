update_settings:
  fields:
    charge_start:
      example: "01:00"
      selector:
        time:
    charge_end:
      example: "05:00"
      selector:
        time:
    end_soc_summer:
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    end_soc_winter:
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    end_soc_offpeak:
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    ac_charge_kw:
      selector:
        number:
          min: 0.5
          max: 20
          step: 0.5
          unit_of_measurement: kW
    entry_id:
      advanced: true
      selector:
        config_entry:
          integration: eg4_tou
    peaks:
      advanced: true
      example: '{"winter": [["07:00", "11:00"], ["17:00", "21:00"]]}'
      selector:
        object:
    write_groups:
      advanced: true
      example: '{"hold_windows": false}'
      selector:
        object:
    hold:
      advanced: true
      example: '{"winter": [["00:00", "07:00"], ["21:00", "23:59"]]}'
      selector:
        object:
    start_soc_gap:
      advanced: true
      selector:
        number:
          min: 0
          max: 50
          unit_of_measurement: "%"
    soc_min:
      advanced: true
      selector:
        number:
          min: 0
          max: 99
          unit_of_measurement: "%"
    soc_max:
      advanced: true
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
    ac_kw_max:
      advanced: true
      selector:
        number:
          min: 1
          max: 20
          unit_of_measurement: kW
    poll_minutes:
      advanced: true
      selector:
        number:
          min: 1
          max: 120
          unit_of_measurement: min
set_tariff:
  fields:
    name:
      required: true
      example: "Summer plan"
      selector:
        text:
    entry_id:
      advanced: true
      selector:
        config_entry:
          integration: eg4_tou
save_tariff_as:
  fields:
    name:
      required: true
      example: "Utility B"
      selector:
        text:
    peaks:
      advanced: true
      selector:
        object:
    entry_id:
      advanced: true
      selector:
        config_entry:
          integration: eg4_tou
delete_tariff:
  fields:
    name:
      required: true
      selector:
        text:
    entry_id:
      advanced: true
      selector:
        config_entry:
          integration: eg4_tou
get_plan:
  fields:
    entry_id:
      advanced: true
      selector:
        config_entry:
          integration: eg4_tou
import_tariff:
  fields:
    name:
      required: true
      example: "Utility B"
      selector:
        text:
    tariff:
      required: true
      example: '{"seasons": {"summer": {"start": [6, 1], "end": [9, 30]}, "winter": {"start": [10, 1], "end": [5, 31]}}, "peaks": {"summer": [["14:00", "19:00"]], "winter": [["06:00", "09:00"]]}, "peak_days": [0, 1, 2, 3, 4]}'
      selector:
        object:
    entry_id:
      advanced: true
      selector:
        config_entry:
          integration: eg4_tou
