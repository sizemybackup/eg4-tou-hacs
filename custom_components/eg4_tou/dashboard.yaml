# EG4 Local TOU Manager: ready-made dashboard (core cards plus the integration's own two cards).
#
# Needs integration v0.6.0+ for the two custom cards (the integration loads them by itself).
# The setup wizard creates this dashboard for you (v0.10.0+). To add it by hand instead:
# Settings > Dashboards > Add dashboard > "New dashboard from scratch", open it,
# three dots > Edit dashboard > three dots > Raw configuration editor, and paste this file.
#
# The tables find the integration's entities by themselves. The tiles and controls use the
# default entity ids (sensor.eg4_tou_*, switch.eg4_tou_*, number.eg4_tou_*, time.eg4_tou_*, select.eg4_tou_*).
# If yours differ (for example an older install that got an area prefix), find/replace them
# in the raw editor.
title: EG4 TOU
views:
  - title: Schedule
    path: schedule
    icon: mdi:battery-clock
    type: sections
    max_columns: 3
    sections:
      # ---- 1. What is happening and when ------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: TOU & AC First Rules
            icon: mdi:calendar-clock
          # Status table with live countdowns. Season, billing window, next window, power source,
          # grid charging, next charge and inverter schedule need nothing else. To also get Battery
          # and Peak Reserve rows, add your own battery sensors (names below are examples):
          - type: custom:eg4-tou-rules-card
            # battery_soc_entity: sensor.my_battery_soc                  # %
            # battery_charge_power_entity: sensor.my_battery_charge_w    # W
            # battery_discharge_power_entity: sensor.my_battery_discharge_w
            # load_power_entity: sensor.my_house_load_w                  # W, for Peak Reserve
            # battery_capacity_kwh: 32.1
            # soc_floor: 20
            # time_format: 12                                           # or 24
          # 24-hour timeline; finds its sensor by itself and has its own title.
          - type: custom:eg4-tou-timeline-card

      # ---- 2. Is the inverter doing what the plan says? --------------------
      - type: grid
        cards:
          - type: heading
            heading: Status
            icon: mdi:solar-power-variant
          - type: tile
            entity: sensor.eg4_tou_controller_status
            name: Mode
            icon: mdi:shield-check
            grid_options: { columns: 6 }
          - type: tile
            entity: sensor.eg4_tou_active_profile
            name: Today's profile
            icon: mdi:calendar-today
            grid_options: { columns: 6 }
          - type: tile
            entity: sensor.eg4_tou_registers_out_of_sync
            name: Settings out of sync
            icon: mdi:file-compare
            grid_options: { columns: 12 }
          - type: conditional
            conditions:
              - condition: state
                entity: switch.eg4_tou_read_only_mode
                state: "on"
            card:
              type: markdown
              content: >-
                **Read-only mode.** The integration is reading your inverter and showing the plan
                below, but it is **not writing anything**. Turn off "Read-only mode" under
                Controls when the plan looks right.
          - type: conditional
            conditions:
              - condition: state
                entity: switch.eg4_tou_read_only_mode
                state: "off"
            card:
              type: markdown
              content: >-
                **Read-write mode.** Differences between the plan and the inverter are
                written automatically every 10 minutes.
          - type: heading
            heading: Plan vs inverter
            icon: mdi:table-clock
          - type: markdown
            content: |-
              {% set ents = integration_entities('eg4_tou') %}
              {% set prof = ents | select('match', 'sensor[.].*_active_profile$') | list | first | default('') %}
              {% set rules = state_attr(prof, 'rules') if prof else none %}
              {% if rules %}
              | Rule | Plan | Inverter now | |
              |:--|:--|:--|:-:|
              {% for r in rules -%}
              | {{ r.rule }} | {{ r.plan }} | {{ r.now }} | {{ '' if r.in_sync is none else ('✅' if r.in_sync else '⚠️') }} |
              {% endfor %}
              {% else %}
              The first inverter reading has not arrived yet.
              {% endif %}
          - type: heading
            heading: Pending changes
            heading_style: subtitle
          - type: markdown
            content: |-
              {% set ents = integration_entities('eg4_tou') %}
              {% set pend = ents | select('match', 'sensor[.].*_registers_out_of_sync$') | list | first | default('') %}
              {% set ch = state_attr(pend, 'changes') if pend else [] %}
              {% if ch %}**{{ ch | count }} setting(s) differ from the plan:**
              {% for c in ch %}- {{ c }}
              {% endfor %}{% else %}Everything the integration manages matches the plan.{% endif %}

      # ---- Storm prep -------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Storm prep
            icon: mdi:weather-lightning-rainy
          - type: markdown
            content: |-
              {% set ents = integration_entities('eg4_tou') %}
              {% set s = ents | select('match', 'sensor[.].*_storm_recommendation$') | list | first | default('') %}
              {% set rec = states(s) %}
              {% set o = state_attr(s, 'onset') %}
              {% set e = state_attr(s, 'ends') %}
              **{{ {'prep': 'Prep recommended', 'watch': 'Keep an eye on the weather', 'clear': 'No storm expected', 'not_configured': 'No weather source configured'}.get(rec, 'Weather data unavailable') }}**
              {% if state_attr(s, 'headline') %}

              {{ state_attr(s, 'headline') }}{% if o %}

              From {{ (o | as_datetime | as_local).strftime('%a %H:%M') }}{% endif %}{% if e %} to {{ (e | as_datetime | as_local).strftime('%a %H:%M') }}{% endif %}{% endif %}

              {% if state_attr(s, 'prep') %}**Storm prep is on:** charging to {{ state_attr(s, 'target_soc') }}% in off-peak hours until {{ (state_attr(s, 'until') | as_datetime | as_local).strftime('%a %H:%M') }}.{% elif state_attr(s, 'skipped') %}This storm is skipped.{% elif state_attr(s, 'automatic') %}Automatic mode starts storm prep for National Weather Service storm warnings and watches.{% else %}Turn on Storm prep to charge ahead of a storm.{% endif %}

              {% if rec == 'not_configured' %}Add your weather zones under Settings > Devices & services > EG4 Local TOU Manager > Configure > Storm prep.{% endif %}
          - type: tile
            entity: switch.eg4_tou_storm_prep
            name: Storm prep
            features:
              - type: toggle
          - type: tile
            entity: switch.eg4_tou_storm_prep_automatic
            name: Automatic
            features:
              - type: toggle
          - type: entities
            show_header_toggle: false
            entities:
              - entity: number.eg4_tou_storm_prep_charge_target
                name: Charge target
              - entity: button.eg4_tou_skip_this_storm
                name: Skip this storm

      # ---- 3. Controls ------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Controls
            icon: mdi:tune
          - type: entities
            show_header_toggle: false
            entities:
              - entity: switch.eg4_tou_read_only_mode
                name: Read-only mode (no writes)
              - entity: switch.eg4_tou_controller_enabled
                name: Controller enabled (off = paused)
              - entity: select.eg4_tou_tariff
                name: Tariff in use
              - type: section
                label: Charge limit (overnight charge stops at)
              - entity: number.eg4_tou_charge_limit_summer_weekday
                name: Summer weekday
              - entity: number.eg4_tou_charge_limit_winter_weekday
                name: Winter weekday
              - entity: number.eg4_tou_charge_limit_weekend_holiday
                name: Weekend / holiday
              - type: section
                label: Overnight charge window
              - entity: time.eg4_tou_charge_start
                name: Starts
              - entity: time.eg4_tou_charge_end
                name: Ends
              - entity: number.eg4_tou_ac_charge_power
                name: AC charge power
